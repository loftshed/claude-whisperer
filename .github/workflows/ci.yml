name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a default-branch run: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release preview needs every commit and release tag.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The checked-in Yarn release runs without corepack.
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      # Lets the gate run `claude plugin validate`, which works offline.
      - run: npm install -g @anthropic-ai/claude-code
      - run: ./scripts/check.sh
      # Builds the pending release in a scratch worktree and runs the gate on it.
      - run: node scripts/release.js check

  test:
    # The plugins target macOS (menu bar app, Mac-to-Mac migration).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: ./scripts/test.sh
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit
          path: junit.xml
          retention-days: 1

  release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Same platform as the test job, because the release reruns the full gate.
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # scripts/release.js authenticates its own push.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node scripts/release.js publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: a token that may push past branch protection on main.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
